<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Lueri Delivery Checkout</title>
<meta name="description" content="Lueri International delivery payment checkout.">
<style>
:root{--ink:#18251f;--paper:#f7f4eb;--green:#274238;--accent:#b8321f;--muted:#66736d;--line:rgba(24,37,31,.14)}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#eef0eb,#f7f4eb);color:var(--ink);font-family:Arial,sans-serif;min-height:100vh}
.wrap{width:min(720px,calc(100% - 28px));margin:28px auto}.brand{font-weight:900;letter-spacing:.06em;margin-bottom:18px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 18px 50px rgba(24,37,31,.1)}
.head{background:var(--green);color:var(--paper);padding:24px}.head h1{margin:0 0 7px;font-size:1.55rem}.head p{margin:0;opacity:.82;line-height:1.5}
.body{padding:22px}.amount{font-size:2rem;font-weight:900;margin:4px 0 20px}.ref{font-family:monospace;color:var(--green);font-weight:800;word-break:break-all}
.box{border:1px solid var(--line);border-radius:13px;padding:16px;margin:14px 0;background:#fafbf9}.label{font-size:.72rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:800}.value{font-size:1.15rem;font-weight:900;margin-top:6px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.copy{padding:8px 12px;font-size:.8rem;background:#e9efe9;color:var(--green)}
.steps{line-height:1.7;margin:10px 0 0;padding-left:20px}.hint{background:#fff7df;border:1px solid #ead89a;border-radius:12px;padding:13px;line-height:1.5;font-size:.9rem;margin-top:14px}
.status{margin-top:18px;padding:13px;border-radius:12px;background:#eef5f0;font-weight:700}.actions{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}button,a.btn{border:0;border-radius:10px;padding:12px 15px;font-weight:800;text-decoration:none;cursor:pointer;font-size:.95rem}button{background:var(--green);color:#fff}a.btn{background:#eee;color:var(--ink)}
.error{background:#fff0ed;color:#8f2417;border:1px solid #e0b0a8;padding:14px;border-radius:12px}
.small{font-size:.78rem;color:var(--muted);line-height:1.5;margin-top:16px}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">LUERI INTERNATIONAL</div>
  <main class="card">
    <section class="head"><h1 id="t-title">Delivery Checkout</h1><p id="t-sub">Complete your Lueri delivery payment using the NCBA Till.</p></section>
    <section class="body" id="content"><p id="t-load">Loading your secure booking payment…</p></section>
  </main>
</div>
<script>
(function(){
'use strict';
const SUPA='https://ylifvexqamxvwzvhmwex.supabase.co/functions/v1';
const WA='https://wa.link/qk7m3b';
const LANGS=['en','sw','fr','es','ar','pt','zh'];
const T={
 en:{title:'Delivery Checkout',sub:'Complete your Lueri delivery payment using the NCBA Till.',load:'Loading your secure booking payment…',bad:'Invalid or missing booking reference.',fail:'Unable to load payment details.',due:'Amount due',paybill:'NCBA PayBill',account:'Account number',ref:'Booking reference (keep for support)',how:'How to pay',
  steps:['Open M-Pesa, choose <b>Lipa na M-Pesa</b>, then <b>Pay Bill</b>.','Business Number: <b>{paybill}</b>.','Account Number: <b>{account}</b> (exactly as shown).','Amount: <b>KES {amount}</b> (the exact amount).','Enter your M-Pesa PIN and send.'],
  from:'Pay from the phone number you booked with ({phone}) so we can match your payment automatically.',paid:'Payment confirmed. Your booking payment has been reconciled.',pending:'Payment pending. Your booking stays pending until Lueri receives and reconciles the NCBA transaction.',check:'Check payment status',back:'Return to Lueri',pin:'Never share your M-Pesa PIN with Lueri or anyone else.',help:'Paid but still pending, or paid from a different number? WhatsApp us your M-Pesa confirmation message and booking reference.',wa:'WhatsApp Lueri',copy:'Copy',copied:'Copied'},
 sw:{title:'Malipo ya Delivery',sub:'Kamilisha malipo ya delivery yako ya Lueri kwa NCBA Till.',load:'Tunapakia malipo yako salama…',bad:'Rejea ya booking si sahihi au haipo.',fail:'Imeshindwa kupakia maelezo ya malipo.',due:'Kiasi cha kulipa',paybill:'NCBA PayBill',account:'Nambari ya akaunti',ref:'Rejea ya booking (ihifadhi kwa msaada)',how:'Jinsi ya kulipa',
  steps:['Fungua M-Pesa, chagua <b>Lipa na M-Pesa</b>, kisha <b>Pay Bill</b>.','Business Number: <b>{paybill}</b>.','Account Number: <b>{account}</b> (kama inavyoonekana).','Kiasi: <b>KES {amount}</b> (kiasi kamili).','Weka PIN yako ya M-Pesa na utume.'],
  from:'Lipa kwa namba ya simu uliyotumia kuagiza ({phone}) ili malipo yako yalinganishwe kiotomatiki.',paid:'Malipo yamethibitishwa. Malipo ya booking yako yamelinganishwa.',pending:'Malipo yanasubiriwa. Booking yako itabaki ikisubiri hadi Lueri ipokee na kulinganisha muamala wa NCBA.',check:'Angalia hali ya malipo',back:'Rudi Lueri',pin:'Usimpe mtu yeyote PIN yako ya M-Pesa, wala Lueri.',help:'Umelipa lakini bado inasubiri, au umelipa kwa namba tofauti? Tuma ujumbe wa uthibitisho wa M-Pesa na rejea ya booking kupitia WhatsApp.',wa:'WhatsApp Lueri',copy:'Nakili',copied:'Imenakiliwa'},
 fr:{title:'Paiement de la livraison',sub:'Effectuez le paiement de votre livraison Lueri via le Till NCBA.',load:'Chargement de votre paiement sécurisé…',bad:'Référence de réservation invalide ou manquante.',fail:'Impossible de charger les détails du paiement.',due:'Montant à payer',paybill:'NCBA PayBill',account:'Numéro de compte',ref:'Référence de réservation (à conserver)',how:'Comment payer',
  steps:['Ouvrez M-Pesa, choisissez <b>Lipa na M-Pesa</b>, puis <b>Pay Bill</b>.','Numéro d’entreprise : <b>{paybill}</b>.','Numéro de compte : <b>{account}</b> (exactement comme affiché).','Montant : <b>KES {amount}</b> (montant exact).','Saisissez votre code PIN M-Pesa et envoyez.'],
  from:'Payez depuis le numéro de téléphone utilisé pour la réservation ({phone}) afin que nous puissions rapprocher votre paiement automatiquement.',paid:'Paiement confirmé. Le paiement de votre réservation a été rapproché.',pending:'Paiement en attente. Votre réservation reste en attente jusqu’à ce que Lueri reçoive et rapproche la transaction NCBA.',check:'Vérifier le statut du paiement',back:'Retour à Lueri',pin:'Ne partagez jamais votre code PIN M-Pesa avec Lueri ni avec personne.',help:'Payé mais toujours en attente, ou payé depuis un autre numéro ? Envoyez-nous par WhatsApp le message de confirmation M-Pesa et la référence de réservation.',wa:'WhatsApp Lueri',copy:'Copier',copied:'Copié'},
 es:{title:'Pago de la entrega',sub:'Completa el pago de tu entrega Lueri con el Till de NCBA.',load:'Cargando tu pago seguro…',bad:'Referencia de reserva no válida o ausente.',fail:'No se pudieron cargar los datos del pago.',due:'Importe a pagar',paybill:'NCBA PayBill',account:'Número de cuenta',ref:'Referencia de reserva (guárdala)',how:'Cómo pagar',
  steps:['Abre M-Pesa, elige <b>Lipa na M-Pesa</b> y luego <b>Pay Bill</b>.','Número de negocio: <b>{paybill}</b>.','Número de cuenta: <b>{account}</b> (exactamente como aparece).','Importe: <b>KES {amount}</b> (el importe exacto).','Introduce tu PIN de M-Pesa y envía.'],
  from:'Paga desde el número de teléfono con el que reservaste ({phone}) para que podamos conciliar tu pago automáticamente.',paid:'Pago confirmado. El pago de tu reserva ha sido conciliado.',pending:'Pago pendiente. Tu reserva sigue pendiente hasta que Lueri reciba y concilie la transacción de NCBA.',check:'Comprobar estado del pago',back:'Volver a Lueri',pin:'Nunca compartas tu PIN de M-Pesa con Lueri ni con nadie.',help:'¿Pagaste y sigue pendiente, o pagaste desde otro número? Envíanos por WhatsApp el mensaje de confirmación de M-Pesa y la referencia de reserva.',wa:'WhatsApp Lueri',copy:'Copiar',copied:'Copiado'},
 ar:{title:'الدفع للتوصيل',sub:'أكمل دفع توصيل Lueri عبر NCBA Till.',load:'جارٍ تحميل الدفع الآمن…',bad:'مرجع الحجز غير صالح أو مفقود.',fail:'تعذر تحميل تفاصيل الدفع.',due:'المبلغ المستحق',paybill:'NCBA PayBill',account:'رقم الحساب',ref:'مرجع الحجز (احتفظ به للدعم)',how:'طريقة الدفع',
  steps:['افتح M-Pesa واختر <b>Lipa na M-Pesa</b> ثم <b>Pay Bill</b>.','رقم الأعمال: <b>{paybill}</b>.','رقم الحساب: <b>{account}</b> (كما هو معروض تماماً).','المبلغ: <b>KES {amount}</b> (المبلغ الدقيق).','أدخل رمز PIN الخاص بـ M-Pesa وأرسل.'],
  from:'ادفع من رقم الهاتف الذي حجزت به ({phone}) حتى نتمكن من مطابقة دفعتك تلقائياً.',paid:'تم تأكيد الدفع. تمت مطابقة دفعة حجزك.',pending:'الدفع قيد الانتظار. سيبقى حجزك قيد الانتظار حتى تستلم Lueri معاملة NCBA وتطابقها.',check:'تحقق من حالة الدفع',back:'العودة إلى Lueri',pin:'لا تشارك رمز PIN الخاص بـ M-Pesa مع Lueri أو أي شخص آخر.',help:'دفعت وما زال الدفع قيد الانتظار، أو دفعت من رقم مختلف؟ أرسل لنا رسالة تأكيد M-Pesa ومرجع الحجز عبر واتساب.',wa:'واتساب Lueri',copy:'نسخ',copied:'تم النسخ'},
 pt:{title:'Pagamento da entrega',sub:'Conclua o pagamento da sua entrega Lueri através do Till NCBA.',load:'A carregar o seu pagamento seguro…',bad:'Referência de reserva inválida ou em falta.',fail:'Não foi possível carregar os dados do pagamento.',due:'Valor a pagar',paybill:'NCBA PayBill',account:'Número da conta',ref:'Referência da reserva (guarde-a)',how:'Como pagar',
  steps:['Abra o M-Pesa, escolha <b>Lipa na M-Pesa</b> e depois <b>Pay Bill</b>.','Número do negócio: <b>{paybill}</b>.','Número da conta: <b>{account}</b> (exatamente como mostrado).','Valor: <b>KES {amount}</b> (o valor exato).','Introduza o seu PIN do M-Pesa e envie.'],
  from:'Pague a partir do número de telefone com que reservou ({phone}) para que possamos conciliar o pagamento automaticamente.',paid:'Pagamento confirmado. O pagamento da sua reserva foi conciliado.',pending:'Pagamento pendente. A sua reserva fica pendente até a Lueri receber e conciliar a transação NCBA.',check:'Verificar estado do pagamento',back:'Voltar à Lueri',pin:'Nunca partilhe o seu PIN do M-Pesa com a Lueri nem com ninguém.',help:'Pagou e continua pendente, ou pagou de outro número? Envie-nos por WhatsApp a mensagem de confirmação do M-Pesa e a referência da reserva.',wa:'WhatsApp Lueri',copy:'Copiar',copied:'Copiado'},
 zh:{title:'配送付款',sub:'请通过 NCBA Till 完成您的 Lueri 配送付款。',load:'正在加载您的安全付款信息…',bad:'预订参考号无效或缺失。',fail:'无法加载付款详情。',due:'应付金额',paybill:'NCBA PayBill',account:'账号',ref:'预订参考号（请保留以便咨询）',how:'付款方式',
  steps:['打开 M-Pesa，选择 <b>Lipa na M-Pesa</b>，然后选择 <b>Pay Bill</b>。','Business Number：<b>{paybill}</b>。','Account Number：<b>{account}</b>（与显示完全一致）。','金额：<b>KES {amount}</b>（必须是准确金额）。','输入您的 M-Pesa PIN 并发送。'],
  from:'请使用预订时填写的手机号（{phone}）付款，以便我们自动匹配您的付款。',paid:'付款已确认。您的预订付款已核对。',pending:'付款待确认。在 Lueri 收到并核对 NCBA 交易之前，您的预订将保持待处理状态。',check:'查询付款状态',back:'返回 Lueri',pin:'切勿将您的 M-Pesa PIN 告诉 Lueri 或任何人。',help:'已付款但仍显示待处理，或使用了其他号码付款？请通过 WhatsApp 发送 M-Pesa 确认短信和预订参考号。',wa:'WhatsApp 联系 Lueri',copy:'复制',copied:'已复制'}
};
function lang(){try{const p=new URLSearchParams(location.search).get('lang');const c=[p,localStorage.getItem('lueri_language'),localStorage.getItem('lueri-language'),localStorage.getItem('lueri_lang'),localStorage.getItem('lueri_locale')];return c.find(v=>LANGS.includes(v))||'en';}catch(_){return'en';}}
const lc=lang(),tr=T[lc]||T.en;
document.documentElement.lang=lc==='zh'?'zh-CN':lc;document.documentElement.dir=lc==='ar'?'rtl':'ltr';
document.getElementById('t-title').textContent=tr.title;document.getElementById('t-sub').textContent=tr.sub;document.getElementById('t-load').textContent=tr.load;
const ref=new URLSearchParams(location.search).get('reference')||'';
const el=document.getElementById('content');
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function copyRow(label,value){return '<div class="box"><div class="label">'+esc(label)+'</div><div class="row"><div class="value">'+esc(value)+'</div><button type="button" class="copy" data-copy="'+esc(value)+'">'+esc(tr.copy)+'</button></div></div>';}
async function load(){
 if(!/^LR-DEL-\d{10,}-[A-Za-z0-9]{8}$/.test(ref)){el.innerHTML='<div class="error">'+esc(tr.bad)+'</div>';return;}
 try{
  const r=await fetch(SUPA+'/ncba-payment-status?reference='+encodeURIComponent(ref),{cache:'no-store'});
  const d=await r.json();
  if(!r.ok)throw new Error(d.error||tr.fail);
  const paybill=d.paybill||'880100',account=d.account||'PAYLUERIINT',amount=Number(d.amount||0).toLocaleString('en-US');
  const steps=tr.steps.map(s=>'<li>'+s.replace('{paybill}',esc(paybill)).replace('{account}',esc(account)).replace('{amount}',esc(amount))+'</li>').join('');
  el.innerHTML='<div class="label">'+esc(tr.due)+'</div><div class="amount">KES '+esc(amount)+'</div>'+
   copyRow(tr.paybill,paybill)+copyRow(tr.account,account)+
   '<div class="box"><div class="label">'+esc(tr.ref)+'</div><div class="ref">'+esc(d.reference)+'</div></div>'+
   '<div class="box"><div class="label">'+esc(tr.how)+'</div><ol class="steps">'+steps+'</ol></div>'+
   (d.payFrom?'<div class="hint">'+esc(tr.from.replace('{phone}',d.payFrom))+'</div>':'')+
   '<div class="status">'+esc(d.paid?tr.paid:tr.pending)+'</div>'+
   '<div class="actions"><button id="refresh" type="button">'+esc(tr.check)+'</button><a class="btn" href="/">'+esc(tr.back)+'</a></div>'+
   '<p class="small">'+esc(tr.pin)+' '+esc(tr.help)+' <a href="'+WA+'" rel="noopener">'+esc(tr.wa)+'</a></p>';
  document.getElementById('refresh').onclick=load;
  el.querySelectorAll('[data-copy]').forEach(b=>b.onclick=async()=>{try{await navigator.clipboard.writeText(b.getAttribute('data-copy'));b.textContent=tr.copied;setTimeout(()=>{b.textContent=tr.copy;},1500);}catch(_){}});
 }catch(e){el.innerHTML='<div class="error">'+esc(e.message)+'</div><div class="actions"><a class="btn" href="/">'+esc(tr.back)+'</a></div>';}
}
load();
})();
</script>
</body>
</html>
