name: Web Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: JS + HTML + links
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Node syntax check — all JavaScript
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' files < <(find . -type f -name '*.js' -not -path './.git/*' -not -path './node_modules/*' -print0)
          count=0
          for file in "${files[@]}"; do
            echo "node --check $file"
            node --check "$file"
            count=$((count+1))
          done
          echo "JavaScript files checked: $count"

      - name: HTML validation — all HTML
        run: npx --yes html-validate@9.48.1 --config .htmlvalidate.json "**/*.html"

      - name: Link check — repository HTML
        uses: lycheeverse/lychee-action@v2
        with:
          args: --verbose --no-progress --exclude-mail "file://**/*.html"
          fail: true
