name: Web Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  javascript:
    name: JavaScript syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Node syntax check — all JavaScript
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' files < <(find . -type f -name '*.js' -not -path './.git/*' -not -path './node_modules/*' -print0)
          count=0
          for file in "${files[@]}"; do
            echo "node --check $file"
            node --check "$file"
            count=$((count+1))
          done
          echo "JavaScript files checked: $count"

  html:
    name: HTML validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: HTML validation — all HTML
        run: npx --yes html-validate@11.16.1 --config .htmlvalidate.json "**/*.html"

  links:
    name: Links + legacy reference audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Legacy reference audit
        shell: bash
        run: |
          set -euo pipefail
          for needle in "lucy-ui.js" "lucy-fix.js" "lucy facts" "lucy schemas"; do
            echo "COMMAND: git grep -nF -- '$needle' -- . ':!.github/workflows/quality.yml'"
            if git grep -nF -- "$needle" -- . ':!.github/workflows/quality.yml'; then
              echo "UNEXPECTED MATCH: $needle"
              exit 1
            else
              echo "NO MATCHES: $needle"
            fi
          done
          echo "COMMAND: git grep -nF -- 'lucy-ui.js' -- lucy-v3.js"
          if git grep -nF -- 'lucy-ui.js' -- lucy-v3.js; then
            exit 1
          else
            echo "NO MATCHES: lucy-ui.js in lucy-v3.js"
          fi
      - name: Supabase browser SDK audit
        shell: bash
        run: |
          set -euo pipefail
          echo "COMMAND: grep -RIn --include='*.html' '@supabase/supabase-js' ."
          grep -RIn --include='*.html' '@supabase/supabase-js' . || true
          echo "COMMAND: resolve floating @2 from jsDelivr"
          curl -fsSL 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/package.json' | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>console.log(JSON.parse(s).version))"

      - name: Link check — repository HTML
        uses: lycheeverse/lychee-action@v2
        with:
          args: --verbose --no-progress "**/*.html"
          fail: true
