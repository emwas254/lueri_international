name: One-time Rewards i18n wiring

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  wire-rewards-i18n:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Wire Rewards page and remove this workflow
        shell: python
        run: |
          from pathlib import Path
          import re
          
          rewards = Path('rewards.html')
          text = rewards.read_text(encoding='utf-8')
          if 'src="lueri-i18n.js"' not in text:
              marker = '<link rel="preconnect" href="https://fonts.googleapis.com">'
              injection = marker + '\n<script src="lueri-i18n.js"></script>'
              if marker not in text:
                  raise SystemExit('Could not find Rewards page head insertion point')
              text = text.replace(marker, injection, 1)
              rewards.write_text(text, encoding='utf-8')
          
          workflow = Path('.github/workflows/one-time-rewards-i18n.yml')
          workflow.unlink(missing_ok=True)

      - name: Commit wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rewards.html .github/workflows/one-time-rewards-i18n.yml
          git diff --cached --quiet && exit 0
          git commit -m "fix(i18n): translate standalone Rewards page"
          git push
