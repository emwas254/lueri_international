name: Lueri one-time payment hotfix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Patch corporate payment UI
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('corporate-signup.js')
          text = path.read_text(encoding='utf-8')

          replacements = [
              (
                  '<option value="whatsapp">Talk to Accounts on WhatsApp</option>\n',
                  '',
              ),
              (
                  "return document.getElementById('corpPaymentMethod')?.value || 'whatsapp';",
                  "return document.getElementById('corpPaymentMethod')?.value || 'pesapal';",
              ),
              (
                  "method.value = 'whatsapp';",
                  "method.value = 'pesapal';",
              ),
              (
                  "              : 'Use WhatsApp for Enterprise/custom quotations or if you need Accounts Desk assistance.';",
                  "              : 'Enterprise uses custom pricing. Submit the application and Lueri will review it before quoting.';",
              ),
              (
                  "      if (paymentMethod === 'pesapal') {\n        await startPesapalPayment(organizationId, planCode);",
                  "      if (!CORPORATE_PLAN_CODES.includes(planCode)) {\n        setOverlay('Enterprise application received', 'Enterprise pricing is custom. Your application has been received for review. Lueri will contact you using the details provided.', null);\n        return;\n      }\n\n      if (paymentMethod === 'pesapal') {\n        await startPesapalPayment(organizationId, planCode);",
              ),
          ]

          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'Required replacement target not found in corporate-signup.js: {old[:120]!r}')
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')

          html = Path('corporate.html')
          h = html.read_text(encoding='utf-8')
          old_script = '<script src="corporate-signup.js"></script>'
          new_script = '<script src="corporate-signup.js?v=20260916-02"></script>'
          if old_script not in h:
              raise SystemExit('corporate-signup.js script tag not found in corporate.html')
          h = h.replace(old_script, new_script, 1)
          html.write_text(h, encoding='utf-8')

      - name: Commit and push hotfix, then remove this one-time workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/lueri-payment-hotfix.yml
          git add corporate-signup.js corporate.html
          git commit -m "Fix corporate payment method routing"
          git push